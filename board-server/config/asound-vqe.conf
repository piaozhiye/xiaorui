# ES8388 2mic+2ref VQE 采集 (2026-10-20, SAI1 SDI1 回环参考)
# 4ch=[活麦,空麦位,refL,refR]@48k; 参考由 numid 22=1/18=0(SDO0) 提供, 见 /data/es8388-aec-mixer.sh
pcm.rkaudio_vqe_48k {
    type rkaudio_vqe
    slave {
        # 按**卡名**寻址, 不写卡号: USB 声卡(ZR USB Audio)插着开机时可能抢到
        # card0, ES8388 被挤到 card1 —— 写死 hw:0,0 就会把采集/播放切到 USB 设备上。
        # 卡名取自 /proc/asound/cards 的 id 字段(rockchipes8388), 与 mixer 脚本
        # `amixer -c rockchipes8388` 用的是同一个名。
        pcm "hw:rockchipes8388,0"
        format S16_LE
        channels 4
        rate 48000
        period_size 4800
        period_count 4
    }
    config_file "/usr/share/rkaudio/config_aivqe_new.json"
    output_format S16_LE
    ref_channels 2
    out_channels 1
    status_file "/tmp/rkaudio_vqe_status"
    dump_pcm 0
    dump_prefix "/tmp/rkaudio_debug"
    dump_path "/tmp/rkaudio_debug"
}

# --- xiaorui 前端入口: 16k/1ch (插件原生 1ch 直出, plug 只做 48k->16k) ---
pcm.xr_vqe_16k {
    type plug
    slave.pcm rkaudio_vqe_48k
}

# --- 前端播放: TTS 24k/1ch 入 -> 48k/2ch 出 ---
# 同样按**卡名**寻址(见上面 rkaudio_vqe_48k 的说明): 写死 hw:0,0 时, USB 声卡
# 插着开机抢到 card0 就会把播放切到 USB 设备上。
pcm.xr_spk {
    type plug
    slave {
        pcm "hw:rockchipes8388,0"
        rate 48000
        channels 2
        format S16_LE
    }
}
