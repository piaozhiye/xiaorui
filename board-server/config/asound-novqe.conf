# 无 VQE 采集配置 —— 不依赖 rockaa 专有件, 本仓库即可复现语音链(无回声抑制)
#
# 部署: adb push board-server/config/asound-novqe.conf /etc/asound.conf
# 选路(xiaorui.env):
#   板载 ES8388 直采: export XR_MIC=xr_mic_16k   (需设 numid 52=8, 见下)
#   USB 麦(最稳):     export XR_MIC=asr_mic      (零配置, 即前端默认值)
# KWS 阈值: 两种都是 export XR_KWS_THRESHOLD=0.15 (VQE 的 0.10 只适用 bf/agc 后电平)
# 详见同目录 AUDIO-NO-VQE.md

# --- 板载 ES8388 直采: plug 做 48k/2ch -> 16k/1ch ---
# 原厂内核即可(2ch 采集); patches/es8323-capture-channels-16.patch 只为 VQE 的
# 4ch 回环参考所需, 此路线不需要。
# mixer(每次开机, 可并入 start-all.sh): amixer -c rockchipes8388 cset numid=52 8
# 采集按**卡名**寻址: 写死 hw:0,0 时 USB 声卡插着开机抢到 card0 会把采集切到 USB 设备。
pcm.xr_mic_16k {
    type plug
    slave {
        pcm "hw:rockchipes8388,0"
        rate 16000
        channels 1
        format S16_LE
    }
}

# --- USB 麦(ZR 声卡, 按卡名寻址防枚举漂移; 字幕项目时代数周生产配置原样) ---
pcm.asr_mic {
    type plug
    slave.pcm "hw:Audio,0"
}

# --- 播放: TTS 24k/1ch -> 48k/2ch 出板载喇叭 (按卡名, 同上) ---
pcm.xr_spk {
    type plug
    slave {
        pcm "hw:rockchipes8388,0"
        rate 48000
        channels 2
        format S16_LE
    }
}
