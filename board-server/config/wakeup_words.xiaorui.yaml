# 小瑞(本机)的唤醒词表 —— 服务端 config.yaml 的 wakeup_words 覆盖层
#
# 为什么单独存一份: board-server/pkg/config.yaml 含第三方 API 密钥, 在
# .gitignore 里不入库, 所以"服务端唤醒词表"没有可入库的真源。2026-10-20
# 实测踩坑: 板上的 config.yaml 是上游小智原版, wakeup_words 里是
# "你好小智/小爱同学/小龙小龙", 根本没有"小瑞" —— 服务端那扇唤醒词门
# 对本机等于关着, "小瑞小瑞"被当普通语句喂给 LLM(回"🙂"), LLM 的应答
# TTS 还会把随后的指令段整个吃掉(云 ASR 只听到 "Okay")。
#
# 怎么用(恢复/重装网关时):
#   1) 把本文件的 wakeup_words 整段替换 board-server/pkg/config.yaml 里
#      同名的那一段(不要动 config.yaml 的密钥部分);
#   2) 重启两个网关实例即生效。
#
# 列表必须与前端 board/xr_wake.h 的变体表一一对应 —— 每个变体字都要有
# 它的双单元形式。tests/test_wakeup_config.py 会机械校验这一点。
#
# 拼音形态(xiaorui)靠大小写不敏感比较命中, 所以只列小写一种写法。
wakeup_words:
  # 板子 KWS 关键词(@小瑞小瑞 / @小瑞, /data/rknn-test/sherpa/model-kws/keywords.txt)
  - "小瑞小瑞"
  - "小瑞"
  # ASR 听岔的双单元变体(与前端 board/xr_wake.h 变体表一一对应)
  - "小翠小翠"
  - "小队小队"
  - "小子小子"
  - "小薇小薇"
  - "小妹小妹"
  - "小绿小绿"
  - "小贵小贵"
  - "小月小月"
  - "小院小院"
  - "小丽小丽"
  - "小热小热"
  - "小略小略"
  - "小玉小玉"
  # 2026-10-20 板端实测新增: 本地 RKNN 把唤醒词转成 "小想"/"小看看看"
  - "小想小想"
  - "小看小看"
  # 单单元听岔(一句式"小X帮我开灯"要靠它剥前缀)
  - "小翠"
  - "小队"
  - "小子"
  - "小薇"
  - "小妹"
  - "小绿"
  - "小贵"
  - "小月"
  - "小院"
  - "小丽"
  - "小热"
  - "小略"
  - "小玉"
  - "小想"
  - "小看"
  # "你好" 族(照上游 "你好小智/你好小志/你好小鑫/你好小新" 的枚举法)
  - "你好小瑞"
  - "你好小翠"
  - "你好小队"
  - "你好小子"
  - "你好小薇"
  - "你好小妹"
  - "你好小绿"
  - "你好小贵"
  - "你好小月"
  - "你好小院"
  - "你好小丽"
  - "你好小热"
  - "你好小略"
  - "你好小玉"
  - "你好小想"
  - "你好小看"
  # 拼音形态(ASR 听"你好小瑞"可能直接吐 Latin)
  - "xiaorui"
  - "你好xiaorui"
