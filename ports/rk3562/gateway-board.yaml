# RK3562 板内网关配置（板端全离线形态）
#
# 与 ports/rk3562/gateway-local.example.yaml（PC 侧）同一套 provider 选型，
# 差别只有路径与端口: 全部指向板内资源，LLM 走板内 NPU 上的 RKLLM(:8112)。
#
# 部署位置:
#   /data/xiaorui-gateway/server/          网关代码(pkg/)
#   /data/xiaorui-gateway/work/            cwd (core/models 软链)
#   /data/xiaorui-gateway/data/.config.yaml 本文件
#   /data/xiaorui-gateway/models/           snakers4_silero-vad
#   /data/xiaorui-server/                  RKLLM 运行时/模型, ASR/TTS 模型
server:
  ip: 127.0.0.1
  port: 8001
  http_port: 8004
  auth:
    enabled: false
    allowed_devices: []

enable_websocket_ping: true
enable_wakeup_words_response_cache: false
enable_greeting: true

# 逐句合成按真实音频时长 1x 送往播放器; send_delay 只是两包最小间隔。
tts_audio_send_delay: 20
tts_prebuffer_ms: 4000
# 持久 wire 提前量: 1x 节拍下声卡 just-in-time 空转, TTS 句间供给间隙
# (0.4~0.8s)会击穿声卡 -> 排空/EPIPE 丢 1.92s。保持 2s lead 让声卡常年
# 有余量(同包回放实验 D/E: 14 处 0.6s 间隙, 无 lead 14 处写停顿全中,
# lead=2s 后 0 击穿 0 EPIPE)。
tts_lead_ms: 2000
# 留出客户端 30s 环及 ALSA 缓冲余量，长回答也不能无限灌入。
tts_max_ahead_ms: 12000

# >>> wakeup_words <<<
# 这一段由 deploy-board-gateway.sh 从 board-server/config/wakeup_words.xiaorui.yaml
# 注入(那个文件是唯一真源, 见 tests/test_wakeup_config.py)。
# 别在这里手写副本: 2026-11-11 实测, 漏了 wakeup_words 时板子的唤醒词门只剩
# "小X小Y"形状兜底, 词表枚举完全没生效。

selected_module:
  VAD: SileroVAD
  ASR: LocalSenseVoice
  LLM: LocalQwen
  TTS: SherpaLocal
  Memory: nomem
  Intent: function_call

LLM:
  LocalQwen:
    # 板内 NPU 上的 RKLLM 服务 (llm_rkllm.py, OpenAI 兼容 SSE)
    type: openai
    model_name: qwen2.5-0.5b-instruct
    base_url: http://127.0.0.1:8112/v1
    api_key: local
    temperature: 0.7
    max_tokens: 256
    timeout:
      pool: 2
      connect: 3
      write: 5
      read: 60

# 板内 NPU 上的 Rockchip ASR/TTS (RockX2). 模型常驻 helper 进程:
# ASR 加载 ~3s / TTS ~3.5s 只付一次; 实测 ASR 10s 音频 1.1s 识别完,
# TTS 首包 0.47s。回退开源引擎: 把 selected_module 改回
# LocalSenseVoice / SherpaLocal 即可(模型仍在板上)。
ASR:
  RockASR:
    type: rock_asr
    lib_dir: /data/xiaorui-server/rockasr/lib
    model_dir: /data/xiaorui-server/rockasr/data
    auth_config: /data/xiaorui-server/rockasr/rockx_auth_config.json
    lang: zh
    timeout_s: 20
  LocalSenseVoice:
    type: sherpa_onnx_local
    model_type: sense_voice
    model_dir: /data/xiaorui-server/asr-sense-voice
    output_dir: tmp/asr
    api_key: local

TTS:
  RockTTS:
    type: rock_tts
    lib_dir: /data/xiaorui-server/rocktts/lib
    model_dir: /data/xiaorui-server/rocktts/data
    auth_config: /data/xiaorui-server/rocktts/rockx_auth_config.json
    alpha: 1.0
    timeout_s: 30
  SherpaLocal:
    type: sherpa_local
    engine: matcha
    model_dir: /data/xiaorui-server/tts-matcha/matcha-icefall-zh-baker
    sid: 0
    # 4 线程 + 1.1 语速(2026-11-12 调优): 板子 4xA53@2GHz, 原 2 线程合成是
    # 响应延迟的瓶颈段; speed 1.1 听感仍自然。调优数据见 HANDOFF-GLM-RK3562。
    num_threads: 4
    speed: 1.1
    output_dir: tmp/

# VAD 用网关自带的 SileroVAD provider (core/providers/vad/silero.py):
# 只依赖 numpy + onnxruntime, 直接跑 snakers4_silero-vad 的 onnx, **不需要 torch**。
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200
