# RK3562 + ES8388 (AIOT LP4X V10) VQE 采集链 —— 1 mic + 1 ref (DLP)
# 4ch 硬件不支持, 故插件 slave 收 2ch: ch0=mic, ch1=play-ref(DLP)
pcm.rkaudio_vqe_48k {
    type rkaudio_vqe
    slave {
        pcm "hw:rockchipes8388,0"
        format S16_LE
        channels 2
        rate 48000
        period_size 768
        period_count 4
    }
    config_file "/usr/share/rkaudio/config_aivqe_new.json"
    output_format S16_LE
    ref_channels 1
    out_channels 1
    status_file "/tmp/rkaudio_vqe_status"
    dump_pcm 0
}
# 48k->16k 用带限重采样(plug 自带的是线性插值, 会折回能量, KWS 不命中)
pcm.xr_vqe_rate {
    type rate
    converter "samplerate_best"
    slave { pcm "rkaudio_vqe_48k"; rate 48000 }
}
pcm.xr_vqe_16k { type plug; slave.pcm "xr_vqe_rate" }
pcm.xr_spk {
    type plug
    slave { pcm "hw:rockchipes8388,0"; rate 48000; channels 2; format S16_LE }
}
