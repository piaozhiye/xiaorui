# RK3562 AIOT DEMO LP4X V10: 2 microphone lanes + 2 SAI loopback references.
# SAI1 SDI0 = codec MIC L/R; SDI1 = SDO0 loopback L/R (set by mixer-es8388.sh).
# This is controller hardware loopback; do not use software DLP numid=62.
pcm.rkaudio_vqe_48k {
    type rkaudio_vqe
    slave {
        pcm "hw:CARD=rockchipes8388,DEV=0"
        format S16_LE
        channels 4
        rate 48000
        period_size 4800
        period_count 4
    }
    config_file "/usr/share/rkaudio/config_aivqe_new.json"
    output_format S16_LE
    ref_channels 2
    out_channels 1
    status_file "/tmp/rkaudio_vqe_status"
    dump_pcm 0
}

# The frontend consumes mono 16 kHz. Use the board's band-limited libsamplerate
# converter for 48 kHz -> 16 kHz rather than plug's linear interpolation.
pcm.xr_vqe_rate {
    type rate
    converter "samplerate_best"
    slave { pcm "rkaudio_vqe_48k"; rate 48000 }
}
pcm.xr_vqe_16k {
    type plug
    slave.pcm "xr_vqe_rate"
}

# TTS output remains on ES8388; no exclusive device handoff is introduced.
pcm.xr_spk {
    type plug
    slave {
        pcm "hw:CARD=rockchipes8388,DEV=0"
        rate 48000
        channels 2
        format S16_LE
    }
}
