<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 桌面图标名称要显示中文(小瑞), 但本板 fontconfig 默认的 sans-serif
     是 DejaVu Sans(无中文字形 -> 豆腐块)。思源黑体就在板上, 挂上去。 -->
<fontconfig>
  <dir>/usr/share/fonts/source-han-sans-cn</dir>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Sans CN</string></edit>
  </match>
</fontconfig>
