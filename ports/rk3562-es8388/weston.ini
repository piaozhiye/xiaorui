# RK3562 + ES8388 (AIOT DEMO LP4X V10) 的 weston 完整配置。
#
# 为什么必须有 [output] 段 (2026-11-20 实机):
#   板载 DSI-1 面板原生就是 **1080x1920 竖屏** (DRM 只暴露这一个 mode),
#   但出厂 weston.ini 没有 [output] 段, weston 会自己挑一个横置 mode
#   (1920x1080), 结果:
#     - UI (LVGL, 按 1080x1920 写死) 收到 1920x1080 -> 直接退出
#       "[ui] unsupported surface size: 1920x1080" -> 界面全黑
#     - 语音主链路完全不受影响 (UI 只是显示层), 所以现象是
#       "语音好好的, 屏是黑的" —— 很容易误判成前端/UI 坏了
#
# ★ mode 指定的是**面板原生竖屏 mode**, 不是 weston 的 transform 旋转:
#   transform=90 会被本板 weston 16 判 "Invalid transform" (它只认
#   normal/flipped/flipped-rotate-* 那套名字), 且即使被接受也不会把
#   逻辑几何交换成 1080x1920 —— 面板本来就支持竖屏 mode, 直接指定它。
#   2026-11-20 实测: mode=1080x1920 生效, weston 日志显示
#   "1080x1920@60.0, preferred, current", UI 随即正常启动并显示真实会话。
#
# 其余段是板子出厂 weston.ini 的原样内容, 未改动。
[core]
backend=drm-backend.so

# Allow running without input devices
require-input=false

# Allow running without output devices
require-outputs=none

# Disable screen idle timeout by default
idle-time=0

# The repaint-window is used to calculate repaint delay(ms) after flipped.
# repaint-window=7

# Allow blending with lower drm planes
# gbm-format=argb8888

[shell]
# top(default)|bottom|left|right|none, none to disable panel
# panel-position=none

# Scale panel size
panel-scale=3

# Set cursor size
cursor-size=32

# none|minutes(default)|minutes-24h|seconds|seconds-24h
clock-format=minutes-24h
clock-with-date=true

# Disable screen locking
locking=false

# Disable the desktop starting up animation
startup-animation=none

[libinput]
# Uncomment below to enable touch screen calibrator(weston-touch-calibrator)
# touchscreen_calibrator=true
# calibration_helper=/bin/weston-calibration-helper.sh

[keyboard]
# Comment this to enable vt switching
vt-switching=false

# Configs for auto key repeat
# repeat-rate=40
# repeat-delay=400

[output]
name=DSI-1
mode=1080x1920
