# 小瑞语音助手: 桌面图标(启动 / 退出整套)。
#
# 机制: weston-desktop-shell 读 /etc/xdg/weston/weston.ini.d/*.ini,
#   [desktop-launcher] = 桌面图标, 三要素 icon=/path=/displayname=
#   [desktop-launcher-group] = 图标组布局(哪个组、行列、尺寸)
#
# 为什么单独开一个组(不直接用 big):
#   厂商的 04-desktop-launcher-group.ini 把 big 组定义成 row=1 column=1,
#   已经被 Chromium 占了; 这里另起一个 xiaorui 组 left-of=big,
#   两个大图标并排, 不改厂商文件(改了会动 Chromium 的位置)。
#
# 图标尺寸: 桌面图标按 PNG 原始像素绘制、不自动缩放(见 04 的注释),
#   所以 256x256 必须配 group 布局, 24x24 放默认组。
#
# 只放「小瑞」一个图标: 退出用小瑞界面自己的退出按钮(设置页里,
# 点两次确认 -> 退出进程 -> 回到本桌面), 桌面不再重复一个退出图标。
[desktop-launcher-group]
name=xiaorui
row=1
column=1
bottom-of=big
padding-left=0.05
padding-top=0.05
gravity=left-top
max-width=300
launcher-ratio=0.8
fit-size=true
spacing-x=0.08
spacing-y=0.15
color=0x11FFFFFF
focused-color=0x22FF0000
icon-alpha=0.9
show-text=true
text-color=0x66000000
text-scale=1.5
launcher-width=256
launcher-height=256

[desktop-launcher]
icon=/usr/share/icons/icon_xiaorui.png
path=/data/xiaorui-ui/xiaorui-start.sh
displayname=小瑞
group=xiaorui
