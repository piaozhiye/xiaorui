# RK3562 + ES8388 (AIOT DEMO LP4X V10) 板端 ALSA 配置。
#
# 部署: adb push ports/rk3562-es8388/asound.conf /etc/asound.conf
#
# 与 ports/rk3562(RK809 + PDM + VQE)的区别:
#   - 没有 rkaudio_vqe 插件(本板是 2ch 模拟 codec, 无 6mic 阵列/无回采 ref)
#   - 没有 dsnoop, 采集直接挂 hw
#   - 不用 asr_mic(那是 USB 麦路线), 板载麦走 xr_mic_16k
#
# 前端要求: XR_MIC=xr_mic_16k, XR_SPK=xr_spk
# 设备名里不能出现 xr_vqe/rkaudio_vqe(否则前端会走 VQE 分支)。

# 采集: 板载麦 -> hw(48k/2ch) -> rate(samplerate_best, 抗混叠重采样) -> plug(降混) -> 16k/1ch
#
# ★ 这块 ES8388 的采集硬件**只支持 48kHz**: 用 arecord -r 16000 会被顶回
#   48000(arecord 会警告 "rate is not accurate"), 若在 slave 里直接写
#   rate 16000, plug 会报 "Slave PCM not usable" -> 前端 EINVAL 打不开。
#
# ★ 为什么中间垫一层 rate 插件: plug 插件自带的重采样是**线性插值, 没有抗混叠**,
#   48k->16k 时 8kHz 以上的内容会折回语音带, 唤醒词(zipformer KWS)对这点很敏感
#   ——实测用纯 plug 时 KWS 一直不命中。板端 alsa-lib 带 libsamplerate 插件:
#     /usr/lib/alsa-lib/libasound_module_rate_samplerate_best.so
#   samplerate_best 做带限重采样, 折回成分被压掉。
pcm.xr_mic_rate {
    type rate
    converter "samplerate_best"
    slave {
        pcm "hw:rockchipes8388,0"
        rate 48000
    }
}

pcm.xr_mic_16k {
    type plug
    slave.pcm "xr_mic_rate"
}

# 播放: TTS 24k/1ch -> 48k/2ch -> 板载喇叭
pcm.xr_spk {
    type plug
    slave {
        pcm "hw:rockchipes8388,0"
        rate 48000
        channels 2
        format S16_LE
    }
}
